server.port=8080

# Database (values come from environment variables, see README)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/natura?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:?set DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Include error messages (for example 'Username is already taken.') in API error responses
server.error.include-message=always

# Allowed browser origins (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

enable.swagger.plugin=true
spring.mvc.pathmatch.matching-strategy=ant-path-matcher
spring.main.allow-bean-definition-overriding=true

# JWT: base64-encoded secret of at least 32 bytes
jwt.secret=${JWT_SECRET:?set JWT_SECRET}
# Token lifetimes in milliseconds (1 hour access, 7 days refresh)
jwt.access.expiration-ms=3600000
jwt.refresh.expiration-ms=604800000

# Optional first admin account (created at startup only if all three are set)
app.admin.username=${ADMIN_USERNAME:}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Link base used in password reset emails
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.mail.from=${MAIL_FROM:no-reply@natura.local}
# Local development only: print emails (including reset links) to the log when SMTP is not set up
app.mail.log-body=${APP_MAIL_LOG_BODY:false}

# Care task reminders: how far ahead to remind, and how often to check (milliseconds)
app.reminders.lookahead-hours=24
app.reminders.interval-ms=3600000
app.reminders.initial-delay-ms=60000
